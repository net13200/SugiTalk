<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="color-scheme" content="dark">
  <title>SugiTalk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span id="dot" class="dot idle" aria-hidden="true"></span>
    <span id="status">Ready</span>
    <span class="spacer"></span>
    <button id="debugBtn" class="icon" aria-label="Debug">🐞</button>
    <button id="settingsBtn" class="icon" aria-label="Settings">⚙︎</button>
  </header>

  <main id="transcript" aria-live="polite">
    <p id="empty" class="empty">Tap <b>Start</b> and hold the phone near the speaker.<br>Japanese appears here, English underneath.</p>
    <div id="entries"></div>
    <div id="interim" class="interim"></div>
  </main>

  <button id="jump" class="jump" hidden>↓ Latest</button>

  <section id="debug" class="debug" hidden>
    <div id="stats" class="stats"></div>
    <pre id="log"></pre>
  </section>

  <footer>
    <button id="speakToggle" class="toggle" aria-pressed="true">🔊 Speak</button>
    <button id="startBtn" class="start">Start</button>
    <button id="jaToggle" class="toggle" aria-pressed="true">あ JA</button>
  </footer>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label class="field">Translation endpoint
        <input id="endpoint" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="https://sugitalk-translate.you.workers.dev  (or: demo)">
        <small>Empty = Japanese only. <code>demo</code> = fake translations.</small>
      </label>
      <label class="field">English voice
        <select id="voice"></select>
      </label>
      <label class="field">Recognition while speaking
        <select id="recDuringSpeech">
          <option value="keep">Keep listening (auto-restart if iOS stops it)</option>
          <option value="pause">Pause while speaking</option>
        </select>
      </label>
      <div id="sliders"></div>
      <div class="row">
        <button type="button" id="copyBtn">Copy transcript</button>
        <button type="button" id="clearBtn">Clear</button>
      </div>
      <div class="row">
        <button type="button" id="resetBtn">Reset settings</button>
        <button value="close" class="primary">Done</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
