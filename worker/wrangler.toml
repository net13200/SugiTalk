# Deployed by Cloudflare Workers Builds from net13200/SugiTalk (main, root dir: worker).
# Pushing to main redeploys. Manual alternative: npx wrangler deploy
name = "sugitalk-translator"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Comma-separated list of site origins allowed to call this Worker.
# Replace with YOUR site's origin (scheme + host, no trailing slash).
ALLOWED_ORIGINS = "https://net13200.github.io,http://localhost:8000"
PROVIDER = "deepl"          # or "google"
TARGET_LANG = "EN-US"
# DEEPL_MODEL_TYPE = "latency_optimized"   # optional, see README

# Secrets (never put them in this file):
#   npx wrangler secret put DEEPL_API_KEY
#   npx wrangler secret put GOOGLE_API_KEY   (only if PROVIDER = "google")
